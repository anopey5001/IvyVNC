name: Release

# Every push to main builds the app and publishes a new GitHub Release
# (tag v1.0.<run number>) containing a debug APK and a signed release APK.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  MAJOR_MINOR: "1.0"   # bump by hand for bigger releases; the last number is automatic

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: ""   # the default "tools platform-tools" no longer exists; we install what we need below

      - name: Install SDK / NDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342"

      - name: Work out version
        run: |
          echo "VERSION_NAME=${MAJOR_MINOR}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "TAG=v${MAJOR_MINOR}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          export NDK="$ANDROID_HOME/ndk/26.2.11394342"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          bash build.sh
          cp built/IvyVNC.apk "IvyVNC-${TAG}-debug.apk"

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret not set - skipping the signed release APK"
            exit 0
          fi
          export NDK="$ANDROID_HOME/ndk/26.2.11394342"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.p12"
          export KEYSTORE_FILE="$RUNNER_TEMP/keystore.p12"
          export RELEASE=1
          bash build.sh
          apksigner verify --print-certs built/IvyVNC.apk
          cp built/IvyVNC.apk "IvyVNC-${TAG}.apk"
          rm -f "$RUNNER_TEMP/keystore.p12"

      - name: Checksums
        run: sha256sum IvyVNC-*.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" IvyVNC-*.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "IvyVNC $TAG" \
            --generate-notes

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.p12"
