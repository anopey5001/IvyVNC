name: Release

# Push a tag like v1.0.0 and this builds, signs and publishes a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK / NDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342"

      - name: Work out version from tag
        run: |
          VER="${GITHUB_REF_NAME#v}"            # v1.2.3 -> 1.2.3
          CORE="${VER%%-*}"                      # 1.2.3-beta1 -> 1.2.3
          IFS=. read -r MAJ MIN PAT <<< "$CORE"
          echo "VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( MAJ * 10000 + ${MIN:-0} * 100 + ${PAT:-0} ))" >> "$GITHUB_ENV"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret (see README > Releasing)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.p12"

      - name: Build and sign
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          export NDK="$ANDROID_HOME/ndk/26.2.11394342"
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          export KEYSTORE_FILE="$RUNNER_TEMP/keystore.p12"
          export RELEASE=1
          bash build.sh
          apksigner verify --print-certs built/IvyVNC.apk
          cp built/IvyVNC.apk "IvyVNC-${GITHUB_REF_NAME}.apk"
          sha256sum "IvyVNC-${GITHUB_REF_NAME}.apk" > "IvyVNC-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          case "$GITHUB_REF_NAME" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "IvyVNC-${GITHUB_REF_NAME}.apk" \
            "IvyVNC-${GITHUB_REF_NAME}.apk.sha256" \
            --title "IvyVNC ${GITHUB_REF_NAME}" \
            --generate-notes --verify-tag $FLAGS

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.p12"
